<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Music Timeline</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;padding:20px}
.app{max-width:480px;margin:auto}
.card{background:#1c1c1c;border-radius:28px;padding:28px 20px;text-align:center;margin-top:12px}
.logo{font-size:54px}
h1{font-size:27px;margin:6px 0}
.muted{opacity:.72;line-height:1.4}
a,button{width:100%;display:block;border:0;border-radius:16px;padding:16px;margin-top:12px;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer}
.play,.primary{background:#fff;color:#111}
button{background:#303030;color:#fff}
#scannerView,#gameView,#countdownView,#answer{display:none}
#reader{margin-top:16px;background:#000;border-radius:18px;overflow:hidden}
.year{font-size:42px;font-weight:800}
.artist{font-size:20px;font-weight:700;margin-top:6px}
.title{font-size:18px;margin-top:4px}
.badge{display:inline-block;background:#282828;border-radius:20px;padding:7px 11px;margin:8px}
.error{color:#ffb4b4;margin-top:10px}
#countdownView{min-height:78vh;display:none;align-items:center;justify-content:center;flex-direction:column;background:#050505}
#countNum{font-size:120px;font-weight:800;line-height:1;margin:20px 0}
#countText{font-size:24px;font-weight:700}
#countSub{opacity:.7;margin-top:8px}
</style>
</head>
<body>
<main class="app">

<section class="card" id="homeView">
  <div class="logo">🎵</div>
  <h1>Music Timeline</h1>
  <p class="muted">Inquadra il QR della carta per iniziare.</p>
  <button class="primary" id="start">📷 SCANSIONA CARTA</button>
</section>

<section class="card" id="scannerView">
  <div class="logo">📷</div>
  <h1>Scansiona la carta</h1>
  <div id="reader"></div>
  <div class="error" id="err"></div>
  <button id="cancel">← ANNULLA</button>
</section>

<section class="card" id="countdownView">
  <div id="countText">Preparati ad ascoltare…</div>
  <div id="countNum">5</div>
  <div id="countSub">Appoggia o gira il telefono</div>
</section>

<section class="card" id="gameView">
  <div class="logo">🎵</div>
  <h1>Canzone misteriosa</h1>
  <p class="muted">Ascolta e collocala nella timeline.</p>
  <div class="badge" id="code"></div>
  <a class="play" id="listen">▶ ASCOLTA SU AMAZON MUSIC</a>
  <button id="reveal">👁 MOSTRA LA RISPOSTA</button>
  <div id="answer">
    <div class="year" id="year"></div>
    <div class="artist" id="artist"></div>
    <div class="title" id="title"></div>
  </div>
  <button class="primary" id="again">📷 SCANSIONA UN'ALTRA CARTA</button>
</section>

</main>
<script>
const cards={"001": {"year": "1976", "artist": "Queen", "title": "Somebody To Love", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NFK2QB&do=play"}, "002": {"year": "1979", "artist": "Queen", "title": "Crazy Little Thing Called Love", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NNVX8Q&do=play"}, "003": {"year": "1986", "artist": "Queen", "title": "Friends Will Be Friends", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NF8VMT&do=play"}, "004": {"year": "1978", "artist": "Queen", "title": "Jealousy", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NQCSSN&do=play"}, "005": {"year": "1986", "artist": "Queen", "title": "One Year Of Love", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5P18HH5&do=play"}, "006": {"year": "1995", "artist": "Queen", "title": "A Winter's Tale", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NWHD6Z&do=play"}, "007": {"year": "1975", "artist": "Queen", "title": "'39", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NF6LCT&do=play"}, "008": {"year": "1995", "artist": "Queen", "title": "Mother Love", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NZKL56&do=play"}, "009": {"year": "1984", "artist": "Queen", "title": "It's A Hard Life", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NZ5H61&do=play"}, "010": {"year": "1980", "artist": "Queen", "title": "Save Me", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NH59R7&do=play"}, "011": {"year": "1995", "artist": "Queen", "title": "Made In Heaven", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5P1BFV4&do=play"}, "012": {"year": "1995", "artist": "Queen", "title": "Too Much Love Will Kill You", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NJ2H9W&do=play"}, "013": {"year": "1980", "artist": "Queen", "title": "Sail Away Sweet Sister", "amazon": "https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NR6QYQ&do=play"}, "014": {"year": "1990", "artist": "The Quireboys", "title": "Sweet Mary Ann", "amazon": "https://music.amazon.it/albums/B009IFWFC4?trackAsin=B008QECG2C&do=play"}, "015": {"year": "1977", "artist": "Status Quo", "title": "Rockin' All Over The World", "amazon": "https://music.amazon.it/albums/B0098CLSAC?trackAsin=B0098CLVG8&do=play"}, "016": {"year": "1974", "artist": "Grand Funk Railroad", "title": "Some Kind Of Wonderful", "amazon": "https://music.amazon.it/albums/B008P62B7G?trackAsin=B008P62S38&do=play"}, "017": {"year": "1990", "artist": "Extreme", "title": "Get The Funk Out", "amazon": "https://music.amazon.it/albums/B07L2CW2WY?trackAsin=B07L2CSHFG&do=play"}, "018": {"year": "1967", "artist": "The Doors", "title": "Break on Through (To the Other Side)", "amazon": "https://music.amazon.it/albums/B009IBS2SE?trackAsin=B008L99HLA&do=play"}, "019": {"year": "1997", "artist": "Kenny Wayne Shepherd", "title": "Blue on Black", "amazon": "https://music.amazon.it/albums/B009INCYSG?trackAsin=B008N58NHG&do=play"}, "020": {"year": "1991", "artist": "Drivin N Cryin", "title": "Build A Fire", "amazon": "https://music.amazon.it/albums/B009IUFPVW?trackAsin=B00987IMCO&do=play"}};

let scanner=null;
let currentCardId=null;

const H=document.getElementById("homeView");
const S=document.getElementById("scannerView");
const C=document.getElementById("countdownView");
const G=document.getElementById("gameView");

function show(v){
  H.style.display="none";
  S.style.display="none";
  C.style.display="none";
  G.style.display="none";
  if(v===C) v.style.display="flex";
  else v.style.display="block";
}

function idFrom(t){
  try{
    const u=new URL(t);
    const c=u.searchParams.get("card");
    if(c) return c.padStart(3,"0");
  }catch(e){}
  const m=String(t).match(/(\d{1,3})/);
  return m ? m[1].padStart(3,"0") : null;
}

function prepareCard(id){
  const c=cards[id];
  if(!c) return false;
  currentCardId=id;
  document.getElementById("code").textContent="Carta "+id;
  document.getElementById("listen").href=c.amazon;
  document.getElementById("year").textContent=c.year;
  document.getElementById("artist").textContent=c.artist;
  document.getElementById("title").textContent=c.title;
  document.getElementById("answer").style.display="none";
  document.getElementById("reveal").style.display="block";
  return true;
}

async function stop(){
  if(scanner){
    try{await scanner.stop();}catch(e){}
    scanner=null;
    document.getElementById("reader").innerHTML="";
  }
}

function startCountdown(id){
  if(!prepareCard(id)) return;
  show(C);

  let n=5;
  const countNum=document.getElementById("countNum");
  countNum.textContent=n;

  const timer=setInterval(()=>{
    n--;
    if(n>0){
      countNum.textContent=n;
    } else {
      clearInterval(timer);
      countNum.textContent="♪";

      // Salviamo la schermata di gioco pronta per quando l'utente torna da Amazon.
      setTimeout(()=>{
        show(G);
        // Navigazione nello stesso tab: è più affidabile di un popup ritardato.
        window.location.href=cards[id].amazon;
      },350);
    }
  },1000);
}

async function scan(){
  await stop();
  show(S);
  document.getElementById("err").textContent="";
  scanner=new Html5Qrcode("reader");
  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:240,height:240}},
      async text=>{
        const id=idFrom(text);
        if(id && cards[id]){
          await stop();
          startCountdown(id);
        } else {
          document.getElementById("err").textContent=id ? "Carta "+id+" non presente." : "QR non valido.";
        }
      },
      ()=>{}
    );
  }catch(e){
    document.getElementById("err").textContent="Controlla il permesso della fotocamera.";
  }
}

document.getElementById("start").onclick=scan;
document.getElementById("again").onclick=scan;
document.getElementById("cancel").onclick=async()=>{await stop();show(H);};
document.getElementById("reveal").onclick=function(){
  document.getElementById("answer").style.display="block";
  this.style.display="none";
};

const initial=new URLSearchParams(location.search).get("card");
if(initial && cards[String(initial).padStart(3,"0")]){
  const id=String(initial).padStart(3,"0");
  prepareCard(id);
  show(G);
} else {
  show(H);
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
