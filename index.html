<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Music Timeline</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px}
.app{width:min(460px,100%)}
.card{background:#1c1c1c;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 14px 45px rgba(0,0,0,.35)}
.logo{font-size:58px;margin-bottom:6px}
h1{font-size:28px;margin:0 0 6px}
.muted{opacity:.72;margin:0 0 24px}
.code{font-size:13px;opacity:.5;margin-bottom:18px}
a,button{width:100%;display:block;border:0;border-radius:16px;padding:16px 18px;margin-top:12px;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer}
.play{background:#fff;color:#111}
button{background:#303030;color:#fff}
#answer{display:none;background:#282828;border-radius:18px;padding:20px;margin-top:18px}
.year{font-size:42px;font-weight:800}
.artist{font-size:20px;font-weight:700;margin-top:6px}
.title{font-size:18px;margin-top:4px}
.hint{font-size:13px;opacity:.6;line-height:1.4;margin-top:18px}
</style>
</head>
<body>
<main class="app">
<section class="card">
<div class="logo">🎵</div>
<h1>Canzone misteriosa</h1>
<p class="muted">Ascolta e prova a collocarla nella tua timeline.</p>
<div class="code" id="cardCode"></div>
<a id="listenBtn" class="play" href="#" rel="noopener">▶ ASCOLTA SU AMAZON MUSIC</a>
<button id="revealBtn">👁 MOSTRA LA RISPOSTA</button>
<div id="answer">
<div class="year" id="year"></div>
<div class="artist" id="artist"></div>
<div class="title" id="title"></div>
</div>
<div class="hint">Prototipo PWA. La carta viene scelta dal parametro nell'indirizzo, per esempio <b>?card=001</b>.</div>
</section>
</main>
<script>
const cards={"001":{"year":"1976","artist":"Queen","title":"Somebody To Love","amazon":"https://music.amazon.it/albums/B0H5NFH4X4?trackAsin=B0H5NFK2QB&do=play&ref=dm_sh_PNhfqhOXwf7dgq9qIb6odPiYB"}};
const params=new URLSearchParams(location.search);
const cardId=params.get("card")||"001";
const card=cards[cardId]||cards["001"];
document.getElementById("cardCode").textContent="Carta "+cardId;
document.getElementById("listenBtn").href=card.amazon;
document.getElementById("year").textContent=card.year;
document.getElementById("artist").textContent=card.artist;
document.getElementById("title").textContent=card.title;
document.getElementById("revealBtn").addEventListener("click",function(){document.getElementById("answer").style.display="block";this.style.display="none"});
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")}
</script>
</body>
</html>
